syntax = "proto3";

option csharp_namespace = "SmartHotel.GrpcProtos";

package GrpcProtos ;

import "google/protobuf/empty.proto" ;
import "common.proto";
import "google/protobuf/struct.proto";
//import "Agreement.proto";
import "Light.proto";
import "Smoke.proto";
import "Temperature.proto";

service Room {
	rpc CreateRoom (CreateRoomRequest) returns (RoomDTO);
	rpc GetAllRoom (google.protobuf.Empty) returns (Rooms);
	rpc UpdateRoom(RoomDTO) returns (google.protobuf.Empty);
	rpc AddRoom(RoomDTO) returns (google.protobuf.Empty);
	rpc RemoveRoom(RoomDTO) returns (google.protobuf.Empty);
	rpc DeleteRoom(DeleteRequestDTO) returns (google.protobuf.Empty);

}

message RoomDTO{
	int32 number = 1;
	bool isRentable = 2;
	bool isOcupated = 3;
	Price rentalPrice =4;
	bool isClimatization = 5;
	bool isIlumination = 6;
	RoomType roomType = 7;
	SmokeDTO smoke = 8;
	string smokeId = 9;
	TemperatureDTO temperature = 10;
	string temperatureId =11;
	LightDTO light = 12 ;
	string lightId = 13;
	string id = 14;

}
message Rooms {
	repeated RoomDTO item = 1;
}
message NullableRoomDTO {
	oneof kind{
		RoomDTO room = 1;
		google.protobuf.NullValue null = 2;
	}
}
message CreateRoomRequest{
	int32 number = 1;
	bool isRentable = 2;
	bool isOcupated = 3;
	Price rentalPrice =4;
	bool isClimatization = 5;
	bool isIlumination = 6;
	RoomType roomType = 7;
	SmokeDTO smoke = 8;
	string smokeId = 9;
	TemperatureDTO temperature = 10;
	string temperatureId =11;
	LightDTO light = 12 ;
	string lightId = 13;
	string id = 14;
	
}