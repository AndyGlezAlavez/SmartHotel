syntax = "proto3";

option csharp_namespace = "SmartHotel.GrpcProtos";

package GrpcProtos;

import "google/protobuf/empty.proto";
import "common.proto";
import "Room.proto";

service Smoke{
	rpc CreateSmoke (CreateSmokeRequest) returns (SmokeDTO);
	rpc GetSmoke (GetRequest) returns (NullableSmokeDTO);
	rpc GetAllSmoke (google.protobuf.Empty) returns (Smokes);
	rpc UpdateSmoke (SmokeDTO) returns (google.protobuf.Empty);
	rpc DeleteSmoke (DeleteRequestDTO) returns (google.protobuf.Empty);
}

message SmokeDTO{
	required string id = 1;
	required double value = 2;
	required double reference = 3;
	required Room room = 4;
}

message Smokes{ 
	   repeated SmokeDTO items = 1;
}

message NullableSmokeDTO{
	oneof kind{
		SmokeDTO Smoke = 1;
	    google.protobuf.Empty null = 2; 
	}
}

message CreateSmokeRequest{ 
	required double value = 1;
	required double reference = 2;
	required Room  room = 3;
}